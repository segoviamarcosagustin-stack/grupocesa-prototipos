<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prototipos — GrupoCESA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b141a;--card:#111c24;--border:#1e2d38;--text:#e9edef;--dim:#8696a0;--accent:#25d366;--accent-dk:#1fa855;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);}
body{display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.wrap{width:100%;max-width:520px;}
.header{text-align:center;margin-bottom:32px;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
.logo svg{flex-shrink:0;}
.logo-text{font-size:18px;font-weight:700;letter-spacing:.02em;}
.logo-text span{color:var(--accent);}
.subtitle{font-size:13px;color:var(--dim);margin-bottom:6px;}
.count{font-size:11px;color:var(--dim);background:#182229;display:inline-block;padding:3px 10px;border-radius:10px;}
.cards{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .15s;}
.card:hover{border-color:var(--accent);transform:translateY(-2px);}
.card:active{transform:scale(.98);}
.card-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.card-avatar-initials{font-size:13px;font-weight:700;letter-spacing:.5px;color:#fff;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:600;margin-bottom:2px;}
.card-desc{font-size:12px;color:var(--dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-arrow{color:var(--dim);flex-shrink:0;font-size:18px;transition:color .2s;}
.card:hover .card-arrow{color:var(--accent);}
.footer{text-align:center;margin-top:32px;}
.footer-label{font-size:9px;font-weight:600;letter-spacing:2px;color:#3d5462;text-transform:uppercase;margin-bottom:4px;}
.footer-name{font-size:12px;font-weight:600;color:#4d6472;letter-spacing:.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 26 26" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" fill="none" stroke="#8696a0" stroke-width="1.6"/>
        <path d="M13 3 A10 10 0 0 1 22 9" stroke="#25d366" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">Grupo<span>CESA</span></div>
    </div>
    <div class="subtitle">Prototipos de chatbots con IA</div>
    <div class="count"><!--__COUNT__--></div>
  </div>
  <div class="cards">
    <!--__CARDS__-->
  </div>
  <div class="footer">
    <div class="footer-label">Desarrollado por</div>
    <div class="footer-name">GrupoCESA</div>
  </div>
</div>
</body>
</html>
